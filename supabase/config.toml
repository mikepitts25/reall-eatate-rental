# Supabase CLI project config for LeaseFlip.
# Docs: https://supabase.com/docs/guides/cli/config
#
# Local stack:  supabase start          (requires Docker)
# Reset + seed: supabase db reset        (runs migrations/ then seed.sql)
# Push to cloud: supabase link --project-ref <ref> && supabase db push

# A short, lowercase project identifier (used to name local containers).
project_id = "leaseflip"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# Local-only: which SQL files seed the database on `supabase db reset`.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email testing inbox (signups, magic links land here).
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Auto-create the property photos bucket for local dev so uploads work
# without a manual dashboard step. Mirrors migrations/0003_storage.sql.
[storage.buckets.property-photos]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Disabled locally so signups log in immediately. Keep ON in production.
enable_confirmations = false

[analytics]
enabled = false
